<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WPP LinkedIn Carousel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="frame">
    <div class="top">
      <div class="brand">WHITE PAPER PRODUCTION</div>
      <div class="pill">Jakarta & Tangerang</div>
    </div>

    <section class="content">
      <div class="kicker" id="kicker"></div>
      <h1 class="title" id="title"></h1>
      <div class="subtitle" id="subtitle"></div>

      <ul class="bullets" id="bullets"></ul>

      <div class="quote" id="quote"></div>

      <div class="cta" id="cta"></div>
    </section>

    <footer class="bottom">
      <div class="meta" id="meta"></div>
      <div class="page" id="page"></div>
    </footer>
  </main>

  <script src="slides.js"></script>
  <script>
    function load() {
      const url = new URL(window.location.href);
      const n = parseInt(url.searchParams.get('slide') || '1', 10);

      const data = window.SLIDES_DATA;
      const slide = data.slides[n - 1] || data.slides[0];

      const $ = (id) => document.getElementById(id);
      $('kicker').textContent = slide.kicker || '';
      $('title').textContent = slide.title || '';
      $('subtitle').textContent = slide.subtitle || '';
      $('quote').textContent = slide.quote || '';
      $('cta').textContent = slide.cta || '';
      $('meta').textContent = slide.meta || '';
      $('page').textContent = `${n} / ${data.slides.length}`;

      const ul = $('bullets');
      ul.innerHTML = '';
      (slide.bullets || []).forEach((b) => {
        const li = document.createElement('li');
        li.textContent = b;
        ul.appendChild(li);
      });

      document.body.classList.toggle('dark', slide.theme === 'dark');
    }

    load();
  </script>
</body>
</html>
